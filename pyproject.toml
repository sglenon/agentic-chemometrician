[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-chemometrician"
version = "0.2.0"
description = "MCP-based agentic chemometrics server for spectral analysis"
requires-python = ">=3.10"
dependencies = [
    "mcp",
    "pydantic>=2.0",
    "numpy",
    "pandas",
    "openpyxl",
    "xlrd>=2.0",
    "scikit-learn",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "xgboost==2.1.4",
    "shap",
    "lime",
    "matplotlib",
    "seaborn",
    "statsmodels",
    "nbformat",
    "langchain",
]

[project.scripts]
chemometrics-mcp = "chemometrics_mcp.cli:mcp_main"
chemometrics = "chemometrics_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
